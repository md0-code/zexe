[package]
name = "zexe-bundler"
version.workspace = true
edition = "2024"
description = "A utility to bundle ZX Spectrum snapshots into standalone executables."
license = "GPL-3.0-only"
repository = "https://github.com/md0-code/zexe"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
flate2 = "1.0.35"
